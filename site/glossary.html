<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glossary · Disagreement, a history</title>
<meta name="description" content="Glossary of terms of art in the history of disagreement, in Greek, Sanskrit, Chinese, Hebrew, Arabic, Latin, German and English.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='16' r='9' fill='%232b6cb0' fill-opacity='.8'/%3E%3Ccircle cx='21' cy='16' r='9' fill='%23c53030' fill-opacity='.8'/%3E%3C/svg%3E">
</head>
<body data-page="glossary" data-drawer-links="1">
<main>
  <div class="kicker">Terms of art</div>
  <h1>Glossary</h1>
  <p class="lede">Technical terms from every tradition in the survey. In entry text across the site these terms are underlined with dots; hover one for its definition or click it to open it here.</p>
  <div class="letter" id="letters"></div>
  <dl class="gloss-list" id="gl"></dl>
</main>
<script src="vendor/d3.min.js"></script>
<script src="data/sources.js"></script>
<script src="data/taxonomy.js"></script>
<script src="data/methods.js"></script>
<script src="data/views.js"></script>
<script src="data/extras.js"></script>
<script src="data/people.js"></script>
<script src="data/glossary.js"></script>
<script src="data/content.js"></script>
<script src="data/readings.js"></script>
<script src="js/common.js"></script>
<script src="js/pages.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const H = HOD;
  const gs = H.glossary.slice().sort((a, b) => H.fold(a.term).localeCompare(H.fold(b.term)));
  const first = (g) => H.fold(g.term)[0].toUpperCase();
  const letters = [...new Set(gs.map(first))];
  document.getElementById("letters").innerHTML = letters.map((l) => `<a href="#L-${l}">${l}</a>`).join(" · ");
  let last = "";
  document.getElementById("gl").innerHTML = gs.map((g) => { const l = first(g); const head = l !== last ? `<h2 id="L-${l}" style="margin-bottom:0">${l}</h2>` : ""; last = l;
    return `${head}<dt id="${g.id}">${g.term}<span class="meta">${g.lang}</span></dt><dd>${g.def}${g.see && H.get(g.see) ? ` <span class="meta">See ${H.link(g.see)}.</span>` : ""}</dd>`; }).join("");
  if (location.hash && !location.hash.includes("=")) setTimeout(() => { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }, 30);
});
</script>
</body>
</html>
