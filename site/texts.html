<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primary texts · Disagreement, a history</title>
<meta name="description" content="Short excerpts from the primary sources of the history of disagreement, from Heraclitus and Plato to Mill and Follett, in public-domain translations where possible.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='16' r='9' fill='%232b6cb0' fill-opacity='.8'/%3E%3Ccircle cx='21' cy='16' r='9' fill='%23c53030' fill-opacity='.8'/%3E%3C/svg%3E">
</head>
<body data-page="texts" data-drawer-links="1">
<main>
  <div class="kicker">In their own words</div>
  <h1>Primary texts</h1>
  <p class="lede">Short passages from the sources themselves, in order of the entry they belong to. Translations are named with each passage; public-domain translations are used where they exist. Each passage also appears in its entry.</p>
  <div id="texts"></div>
</main>
<script src="vendor/d3.min.js"></script>
<script src="data/sources.js"></script>
<script src="data/taxonomy.js"></script>
<script src="data/methods.js"></script>
<script src="data/views.js"></script>
<script src="data/extras.js"></script>
<script src="data/people.js"></script>
<script src="data/glossary.js"></script>
<script src="data/content.js"></script>
<script src="js/common.js"></script>
<script src="js/pages.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const H = HOD;
  const xs = H.excerpts.slice().sort((a, b) => H.get(a.entry).date - H.get(b.entry).date);
  document.getElementById("texts").innerHTML = xs.map((x) => `<section class="gcard" id="${x.id}">
    <div class="meta">${H.year(H.get(x.entry).date)} · ${H.kind(x.entry) === "method" ? "Method" : "View"}: ${H.link(x.entry)}</div>
    <blockquote style="font-family:var(--serif);font-size:1.2rem;margin:.5rem 0">${x.text}</blockquote>
    <div class="meta">${x.who}, ${x.src} · ${x.tr}</div></section>`).join("");
});
</script>
</body>
</html>
